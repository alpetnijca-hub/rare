<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="herren">
  <defs>
    <linearGradient id="grund-herren" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#17110c"/>
      <stop offset="45%" stop-color="#0d0a08"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>

    <radialGradient id="wolke1-herren" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#96541a" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#96541a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#96541a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="wolke2-herren" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d09646" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#d09646" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#d09646" stop-opacity="0"/>
    </radialGradient>

    <!-- Schräger Lichtstreif, wie er über geschliffenem Glas liegt. -->
    <linearGradient id="streif-herren" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe6bd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff2da" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe6bd" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="kante-herren" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8A45D" stop-opacity="0"/>
      <stop offset="45%" stop-color="#e6c98a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C8A45D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fuss-herren" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#050403" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#050403" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050403" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette-herren" cx="50%" cy="42%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Feine Körnung: nimmt der Fläche das Digitale. -->
    <filter id="korn-herren" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.32"/>
      </feComponentTransfer>
    </filter>

    <filter id="weich-herren" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <filter id="halbweich-herren" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#grund-herren)"/>

  <g filter="url(#weich-herren)">
    <ellipse cx="590" cy="340" rx="275" ry="290" fill="url(#wolke1-herren)"/>
    <ellipse cx="190" cy="690" rx="290" ry="260" fill="url(#wolke2-herren)"/>
    <ellipse cx="700" cy="900" rx="200" ry="160" fill="url(#wolke2-herren)" opacity="0.5"/>
  </g>

  <!-- Angedeutete Glaskante: ein weit gezogener Bogen, kaum sichtbar. -->
  <g filter="url(#halbweich-herren)" opacity="0.7">
    <path d="M-40 820 C 220 610, 520 560, 860 390"
          fill="none" stroke="url(#kante-herren)" stroke-width="2"/>
  </g>

  <g filter="url(#halbweich-herren)">
    <rect x="-180" y="520" width="1160" height="26"
          fill="url(#streif-herren)" opacity="0.3"
          transform="rotate(19 400 533)"/>
  </g>

  <rect width="800" height="1000" fill="url(#vignette-herren)"/>
  <rect width="800" height="1000" filter="url(#korn-herren)" opacity="0.6"/>
  <rect y="470" width="800" height="530" fill="url(#fuss-herren)"/>
</svg>
