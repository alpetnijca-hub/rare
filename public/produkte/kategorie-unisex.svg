<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="unisex">
  <defs>
    <linearGradient id="grund-unisex" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#17110c"/>
      <stop offset="45%" stop-color="#0d0a08"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>

    <radialGradient id="wolke1-unisex" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a86a" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#c9a86a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c9a86a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="wolke2-unisex" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7d6440" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#7d6440" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#7d6440" stop-opacity="0"/>
    </radialGradient>

    <!-- Schräger Lichtstreif, wie er über geschliffenem Glas liegt. -->
    <linearGradient id="streif-unisex" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe6bd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff2da" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe6bd" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="kante-unisex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8A45D" stop-opacity="0"/>
      <stop offset="45%" stop-color="#e6c98a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C8A45D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fuss-unisex" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#050403" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#050403" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050403" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette-unisex" cx="50%" cy="42%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Feine Körnung: nimmt der Fläche das Digitale. -->
    <filter id="korn-unisex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.32"/>
      </feComponentTransfer>
    </filter>

    <filter id="weich-unisex" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <filter id="halbweich-unisex" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#grund-unisex)"/>

  <g filter="url(#weich-unisex)">
    <ellipse cx="400" cy="620" rx="330" ry="270" fill="url(#wolke1-unisex)"/>
    <ellipse cx="660" cy="200" rx="260" ry="230" fill="url(#wolke2-unisex)"/>
    <ellipse cx="90" cy="300" rx="210" ry="200" fill="url(#wolke2-unisex)" opacity="0.5"/>
  </g>

  <!-- Angedeutete Glaskante: ein weit gezogener Bogen, kaum sichtbar. -->
  <g filter="url(#halbweich-unisex)" opacity="0.7">
    <path d="M-40 550 C 220 340, 520 290, 860 120"
          fill="none" stroke="url(#kante-unisex)" stroke-width="2"/>
  </g>

  <g filter="url(#halbweich-unisex)">
    <rect x="-180" y="250" width="1160" height="26"
          fill="url(#streif-unisex)" opacity="0.3"
          transform="rotate(-9 400 263)"/>
  </g>

  <rect width="800" height="1000" fill="url(#vignette-unisex)"/>
  <rect width="800" height="1000" filter="url(#korn-unisex)" opacity="0.6"/>
  <rect y="470" width="800" height="530" fill="url(#fuss-unisex)"/>
</svg>
